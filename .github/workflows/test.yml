name: test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  node-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          git config --global user.email ci@example.com
          git config --global user.name ci
      - run: node --test $(git ls-files '*.test.mjs')
